<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20 Sovereign UI/UX Design Systems — Interactive Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fira+Code:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&family=Outfit:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090c;
      --surface-card: #11131a;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* Top Nav */
    header {
      background: #0d0e14; border-bottom: 1px solid var(--border-hairline);
      padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-weight: 800; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 0.75rem; }
    .badge-count {
      background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px;
    }

    /* Main Explorer Layout */
    .explorer-layout { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: calc(100vh - 70px); }
    @media (max-width: 900px) { .explorer-layout { grid-template-columns: 1fr; } }

    /* Left Sidebar List */
    .sidebar {
      background: #0a0b0f; border-right: 1px solid var(--border-hairline);
      padding: 1.5rem 1rem; overflow-y: auto; max-height: calc(100vh - 70px);
    }
    .system-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1rem; border-radius: 10px; cursor: pointer; margin-bottom: 0.5rem;
      border: 1px solid transparent; transition: all 0.2s ease;
    }
    .system-item:hover, .system-item.active {
      background: #141722; border-color: rgba(255, 255, 255, 0.12);
    }
    .system-item.active { border-left: 3px solid #f59e0b; }
    .item-name { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; }
    .item-cat { font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    /* Right Main Display Canvas */
    .main-canvas { padding: 2.5rem; overflow-y: auto; background: radial-gradient(circle at 50% 0%, #121520 0%, #08090c 75%); }

    /* Card Panels */
    .card-panel {
      background: var(--surface-card); border: 1px solid var(--border-hairline);
      border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .system-title { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
    .system-subtitle { font-size: 1rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 1.5rem; }

    /* Color Swatches Grid */
    .swatches-grid { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
    .swatch-item {
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-muted);
    }
    .swatch-color { width: 64px; height: 48px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }

    /* UI Component Display Box */
    .component-stage {
      width: 100%; min-height: 320px; background: #050608; border: 1px solid var(--border-hairline);
      border-radius: 16px; padding: 2rem; display: flex; flex-direction: column; align-items: center;
      justify-content: center; position: relative; overflow: hidden; margin-top: 1.5rem;
    }
  </style>
</head>
<body>

    </div>

      { id: 11, name: "Brew Coffee OS", cat: "☕ 3. Dalga Kahve Mekaniği", colors: ["#180e0a", "#d97706", "#f59e0b", "#2a1810"], desc: "Demleme akış grafiği, TDS ekstraksiyon oranı sayacı ve çekirdek künyesi.", ui: `<div style="background:#180e0a; border:1px solid #d97706; padding:1.5rem; border-radius:12px; font-family:monospace; color:#f59e0b; width:100%; max-width:360px;"><div style="font-size:0.75rem;">ETHIOPIA YIRGACHEFFE</div><div style="font-size:1.4rem; color:#fff;">TDS 1.38% · RATIO 1:16</div></div>` },
      { id: 12, name: "Structure CAD OS", cat: "📐 Mimarlık & CAD Çizim", colors: ["#0c1e3e", "#38bdf8", "#f8fafc", "#1e3a8a"], desc: "Lazer kesim katmanları, DXF izometrik grid ve mimari ölçü çizgileri.", ui: `<div style="background:#0c1e3e; border:1px stroke #38bdf8; padding:1.5rem; border-radius:8px; font-family:monospace; color:#38bdf8; width:100%; max-width:380px;"><div style="font-size:0.8rem;">LAYER: 01_LASER_CUT_DXF</div><div style="font-size:1.2rem; color:#fff;">SCALE 1:50 · TOLERANCE 0.05mm</div></div>` },
      { id: 13, name: "Signals HAM OS", cat: "📻 Telsiz & SDR Spektrum", colors: ["#141f17", "#22c55e", "#f59e0b", "#1c2e22"], desc: "Şelale spektrumu (Waterfall), QSL kart jeneratörü ve frekans kadranı.", ui: `<div style="background:#141f17; border:1px solid #22c55e; padding:1.5rem; border-radius:8px; font-family:'Fira Code', monospace; color:#22c55e; width:100%; max-width:380px;"><div style="font-size:0.8rem;">SDR WATERFALL SPECTRUM</div><div style="font-size:1.5rem; color:#fff;">144.800 MHz FM</div></div>` },
      { id: 14, name: "Terra Overland OS", cat: "🌲 Doğa & Dağcılık", colors: ["#141c14", "#f59e0b", "#22c55e", "#1f2b1f"], desc: "Eğim-irtifa topoğrafya haritası, GPX rota telemetrisi ve pusula.", ui: `<div style="background:#141c14; border:1px solid #f59e0b; padding:1.5rem; border-radius:12px; font-family:sans-serif; color:#f59e0b; width:100%; max-width:360px;"><div style="font-size:0.75rem;">ELEVATION GAIN</div><div style="font-size:1.8rem; font-weight:bold; color:#fff;">1,420 m <span style="font-size:0.8rem; color:#22c55e;">GPS LOCKED</span></div></div>` },

      { id: 16, name: "Gambit Game Theory OS", cat: "♟️ Satranç & Strateji", colors: ["#18181b", "#fef3c7", "#f59e0b", "#27272a"], desc: "FEN notasyonu dizisi, oyun değerlendirme çubuğu ve hamle ağacı.", ui: `<div style="background:#18181b; border:1px solid #fef3c7; padding:1.5rem; border-radius:12px; font-family:serif; color:#fef3c7; width:100%; max-width:360px;"><div style="font-size:0.8rem; font-family:monospace; color:#f59e0b;">EVALUATION: +1.45</div><div style="font-size:1.3rem; margin-top:0.3rem;">1. e4 e5 2. Nf3 Nc6</div></div>` },

    ];

    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = systems.map((sys, idx) => `
        <div class="system-item ${idx === 0 ? 'active' : ''}" onclick="selectSystem(${sys.id})">
          <div>
            <div class="item-name">${sys.name}</div>
            <div class="item-cat">${sys.cat}</div>
          </div>
        </div>
      `).join('');
    }

    function selectSystem(id) {
      document.querySelectorAll('.system-item').forEach((item, idx) => {
        if (systems[idx].id === id) item.classList.add('active');
        else item.classList.remove('active');
      });

      const sys = systems.find(s => s.id === id);
      document.getElementById('sysTitle').innerText = sys.name;
      document.getElementById('sysCat').innerText = `${sys.cat} — ${sys.desc}`;
      
      const swatches = document.getElementById('swatches');
      swatches.innerHTML = sys.colors.map(c => `
        <div class="swatch-item">
          <div class="swatch-color" style="background:${c}"></div>
          <span>${c}</span>
        </div>
      `).join('');

      document.getElementById('compStage').innerHTML = sys.ui;
    }

    renderSidebar();
    selectSystem(1);
  </script>
</body>
</html>
