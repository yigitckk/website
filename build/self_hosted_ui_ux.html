<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yiğit's Sovereign Self-Hosted Stack — UI/UX Redesign Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090c;
      --surface-card: #11131a;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --accent-amber: #f59e0b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* Top Nav */
    header {
      background: #0d0e14; border-bottom: 1px solid var(--border-hairline);
      padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-weight: 800; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 0.75rem; }
    .badge-count {
      background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3);
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 999px;
    }

    /* Layout Grid */
    .app-layout { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: calc(100vh - 70px); }
    @media (max-width: 900px) { .app-layout { grid-template-columns: 1fr; } }

    /* Left Sidebar */
    .sidebar {
      background: #0a0b0f; border-right: 1px solid var(--border-hairline);
      padding: 1.5rem 1rem; overflow-y: auto;
    }
    .service-btn {
      display: flex; flex-direction: column; gap: 0.25rem;
      padding: 0.85rem 1rem; border-radius: 10px; cursor: pointer; margin-bottom: 0.6rem;
      border: 1px solid transparent; background: transparent; transition: all 0.2s ease;
      text-align: left; width: 100%;
    }
    .service-btn:hover, .service-btn.active {
      background: #141722; border-color: rgba(255, 255, 255, 0.12);
    }
    .service-btn.active { border-left: 3px solid var(--accent-amber); }
    .service-title { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .service-sub { font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    /* Main Content Area */
    .main-content { padding: 2.5rem; overflow-y: auto; background: radial-gradient(circle at 50% 0%, #121520 0%, #08090c 80%); }

    .card {
      background: var(--surface-card); border: 1px solid var(--border-hairline);
      border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .redesign-stage {
      width: 100%; min-height: 380px; background: #050608; border: 1px solid var(--border-hairline);
      border-radius: 16px; padding: 2rem; margin-top: 1.5rem; display: flex;
      flex-direction: column; align-items: center; justify-content: center; position: relative;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
        <rect x="2" y="2" width="36" height="36" rx="6" stroke="#f59e0b" stroke-width="2"/>
        <path d="M 12 20 L 28 20 M 20 12 L 20 28" stroke="#38bdf8" stroke-width="2"/>

      <span>YİĞİT'S SELF-HOSTED STACK — UI/UX REDESIGN HUB</span>
    </div>
    <span class="badge-count">8 Sovereign Services</span>

        <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); line-height: 1.6;" id="serviceDetails"></div>

        <div class="redesign-stage" id="stage"></div>
      </div>
    </div>
  </div>

      {
        id: 8, name: "🎮 Cloud Gaming Hub", sub: "Systemd Service · FIFA 17 · Low-Latency Engine",

        details: "Gecikme (ms), FPS ve GPU sıcaklığını şeffaf bir overlay olarak gösteren minimalist başlatıcı kartları.",

              <div style="font-size:0.8rem; color:#8b5cf6;">CLOUD GAMING HUB // SYSTEMD ACTIVE</div>
              <h3 style="font-size:1.4rem; color:#fff; margin:0.4rem 0;">FIFA 17 STREAM</h3>
              <div style="font-size:0.75rem; color:#10b981;">LATENCY: 4.2ms · 1080p 60FPS · GPU 52°C</div>
            </div>`

    ];

    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = services.map((s, idx) => `
        <button class="service-btn ${idx === 0 ? 'active' : ''}" onclick="selectService(${s.id})">
          <span class="service-title">${s.name}</span>
          <span class="service-sub">${s.sub}</span>
        </button>
      `).join('');
    }

    function selectService(id) {
      document.querySelectorAll('.service-btn').forEach((btn, idx) => {
        if (services[idx].id === id) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      const s = services.find(item => item.id === id);
      document.getElementById('serviceName').innerText = s.name;
      document.getElementById('serviceDesc').innerText = s.desc;
      document.getElementById('serviceDetails').innerText = s.details;
      document.getElementById('stage').innerHTML = s.ui;
    }

    renderSidebar();
    selectService(1);
  </script>
</body>
</html>
